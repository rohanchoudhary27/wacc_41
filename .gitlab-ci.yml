cache:
  key: "global-coursier-cache"
  paths:
    - .coursier-cache/
  policy: pull-push

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  COURSIER_CACHE: .coursier-cache

stages:
  - lint
  - build
  - test_frontend
  - test_backend

scalafix_check:
  stage: lint
  script:
    - echo "Running scalafix checks..."
    - scala --power fix --check .
  tags:
    - vm-runner

build:
  stage: build
  script:
    - echo "Compiling and packaging application..."
    - scala --power package . --assembly -o wacc-compiler --server=false
  artifacts:
    paths:
      - wacc-compiler
    expire_in: 1 hour
  tags:
    - vm-runner
  
frontend_unit_tests:
  stage: test_frontend
  script:
    - echo "Running Frontend Unit Tests..."
    - scala test .  --test-only "wacc.frontend.unit.*" --server=false -- -u target/unit-test-reports -oD | tee unit-test.log
  artifacts:
    when: always
    reports:
      junit: target/unit-test-reports/*.xml
    paths:
      - unit-test.log
      - target/unit-test-reports/
    expire_in: 1 hour
  tags:
    - vm-runner

generator_tests:
  stage: test_frontend
  script:
    - echo "Running Random AST Generator Tests..."
    - scala test .  --test-only "wacc.frontend.generator.*" --server=false -- -u target/random-test-reports -oD | tee random-test.log
  artifacts:
    when: always
    reports:
      junit: target/random-test-reports/*.xml
    paths:
      - random-test.log
      - target/ranodm-test-reports/
    expire_in: 1 hour
  tags:
    - vm-runner

frontend_integration_tests:
  stage: test_frontend
  script:
    - echo "Running Frontend Integration Tests..."
    - scala test . --test-only "wacc.frontend.integration.*"  --server=false -- -u target/integration-test-reports -oD | tee integration-test.log
  artifacts:
    when: always
    reports:
      junit: target/integration-test-reports/*.xml
    paths:
      - integration-test.log
      - target/integration-test-reports/
    expire_in: 1 hour
  tags:
    - vm-runner

backend_integration_tests:
  stage: test_backend
  script:
    - echo "Running Backend Integration Tests..."
    - scala test . --test-only "wacc.backend.integration.*"  --server=false -- -u target/integration-test-reports -oD | tee integration-test.log
  artifacts:
    when: always
    reports:
      junit: target/integration-test-reports/*.xml
    paths:
      - integration-test.log
      - target/integration-test-reports/
    expire_in: 1 hour
  tags:
    - vm-runner

backend_unit_tests:
  stage: test_backend
  script:
    - echo "Running Backend Unit Tests..."
    - scala test .  --test-only "wacc.backend.unit.*" --server=false -- -u target/unit-test-reports -oD | tee unit-test.log
  artifacts:
    when: always
    reports:
      junit: target/unit-test-reports/*.xml
    paths:
      - unit-test.log
      - target/unit-test-reports/
    expire_in: 1 hour
  tags:
    - vm-runner