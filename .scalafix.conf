rules = [
  # Auto-fix rules
  RemoveUnused
  RedundantSyntax
  
  # Linting rules
  DisableSyntax
  LeakingImplicitClassVal
  NoValInForComprehension
]

# Basic code quality checks
DisableSyntax.noReturns = true
DisableSyntax.noNulls = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noFinalVal = true
DisableSyntax.noFinalize = true

# Prevent leaking implicit class vals
LeakingImplicitClassVal.enabled = true

# No val keyword in for-comprehensions
NoValInForComprehension.enabled = true

# Remove redundant braces, parens, semicolons
RedundantSyntax.enabled = true
